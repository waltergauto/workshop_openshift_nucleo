# Application
quarkus.http.port=8080

# Database - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:todo}
quarkus.datasource.password=${DB_PASSWORD:todo}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgresql}:${DB_PORT:5432}/${DB_NAME:todosdb}

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# OpenTelemetry
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.otel.exporter.otlp.traces.protocol=grpc
quarkus.otel.exporter.otlp.traces.timeout=30000
quarkus.otel.service.name=todo-backend
quarkus.otel.resource.attributes=service.name=todo-backend

# OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

# Health
# Default root-path is /q/health - use /q/health/live and /q/health/ready
