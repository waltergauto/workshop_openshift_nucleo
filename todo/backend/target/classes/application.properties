# Application
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Database - Default/dev
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/todo
%dev.quarkus.datasource.username=todo
%dev.quarkus.datasource.password=todo
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.log.category."org.todo".level=DEBUG

# Database - Production
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_URL:postgresql://localhost:5432/todo}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:todo}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:todo}
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.log.level=WARN

# Health
quarkus.smallrye-health.root-path=/health

# Kubernetes
quarkus.kubernetes.deployments=deployment
quarkus.kubernetes.image-pull-policy=IfNotPresent
quarkus.kubernetes.liveness-probe.http-action-path=/health/live
quarkus.kubernetes.readiness-probe.http-action-path=/health/ready

# Logging
quarkus.log.level=INFO

# OpenTelemetry Tracing
%prod.quarkus.otel.enabled=true
%prod.quarkus.otel.exporter.otlp.traces.endpoint=http://jaeger:4317
%prod.quarkus.otel.exporter.otlp.traces.protocol=grpc
%prod.quarkus.otel.service.name=todo-backend
%prod.quarkus.otel.traces.sampler=parentbased_always_on

%dev.quarkus.otel.enabled=true
%dev.quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
%dev.quarkus.otel.exporter.otlp.traces.protocol=grpc
%dev.quarkus.otel.service.name=todo-backend
%dev.quarkus.otel.traces.sampler=parentbased_always_on
